openapi: 3.0.0
info:
  title: Tasco API Documentation
  description: API documentation for the Project Manager App (Tasco).
  version: 1.0.0
servers:
  - url: http://localhost:3001/api-v1
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        profilePicture: { type: string }
        xp: { type: number }
        points: { type: number }
        level: { type: number }
        streak: { type: number }
    Workspace:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        owner: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              user: { type: string }
              role: { type: string, enum: [owner, member, admin, viewer] }
    Project:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        workspace: { type: string }
        status: { type: string, enum: [Planning, In Progress, On Hold, Completed, Cancelled] }
        startDate: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        progress: { type: number }
    Task:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        project: { type: string }
        status: { type: string, enum: [To Do, In Progress, Review, Done] }
        priority: { type: string, enum: [Low, Medium, High] }
        assignees: { type: array, items: { type: string } }
        dueDate: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        _id: { type: string }
        workspace: { type: string }
        sender: { type: string }
        content: { type: string }
        image: { type: string }
        createdAt: { type: string, format: date-time }
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        201: { description: User registered successfully }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200: { description: Login successful }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify user email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        200: { description: Email verified }
  /workspaces:
    get:
      tags: [Workspaces]
      summary: Get all workspaces for the current user
      responses:
        200:
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
    post:
      tags: [Workspaces]
      summary: Create a new workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string }
                description: { type: string }
                color: { type: string }
      responses:
        201: { description: Workspace created }
  /workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      summary: Get workspace details
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Workspace details }
  /workspaces/{workspaceId}/projects:
    get:
      tags: [Workspaces]
      summary: Get projects in a workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: List of projects }
  /workspaces/{workspaceId}/invite-member:
    post:
      tags: [Workspaces]
      summary: Invite a member to a workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { type: string, enum: [admin, member, viewer] }
      responses:
        200: { description: Invitation sent }
  /projects/{workspaceId}/create-project:
    post:
      tags: [Projects]
      summary: Create a new project
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, status, startDate]
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string, enum: [Planning, In Progress, On Hold, Completed, Cancelled] }
                startDate: { type: string, format: date-time }
                dueDate: { type: string, format: date-time }
                tags: { type: string }
      responses:
        201: { description: Project created }
  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project details
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Project details }
  /projects/{projectId}/tasks:
    get:
      tags: [Projects]
      summary: Get tasks in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: List of tasks }
  /tasks/{projectId}/create-task:
    post:
      tags: [Tasks]
      summary: Create a new task
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, status, priority, dueDate, assignees]
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string, enum: [To Do, In Progress, Done] }
                priority: { type: string, enum: [Low, Medium, High] }
                dueDate: { type: string, format: date-time }
                assignees: { type: array, items: { type: string } }
      responses:
        201: { description: Task created }
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task details
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Task details }
  /tasks/{taskId}/status:
    put:
      tags: [Tasks]
      summary: Update task status
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
      responses:
        200: { description: Status updated }
  /users/profile:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        200: { description: User profile }
    put:
      tags: [Users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                profilePicture: { type: string }
      responses:
        200: { description: Profile updated }
  /chat/workspaces/{workspaceId}/messages:
    get:
      tags: [Chat]
      summary: Get workspace messages
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: List of messages }
    post:
      tags: [Chat]
      summary: Send a message
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content: { type: string }
                image: { type: string, format: binary }
      responses:
        201: { description: Message sent }
  /achievements:
    get:
      tags: [Achievements]
      summary: Get user achievements
      responses:
        200: { description: List of achievements }
